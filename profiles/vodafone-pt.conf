# Vodafone Portugal FTTH VoIP profile
VOIP_PROFILE_NAME="Vodafone Portugal"
VOIP_WAN_INTERFACE="eth9"
VOIP_WAN_VLAN="101"
VOIP_INTERFACE="voip"
VOIP_DHCP="true"
VOIP_ROUTE_TABLE="101"

# Vodafone IMS networks that must be reachable through VLAN 101.
VOIP_IMS_RANGES="213.30.59.0/24 213.30.55.0/27"

# Networks accepted by UniFi Talk's FreeSWITCH talk_acl.
VOIP_TALK_ACL_RANGES="213.30.59.0/24 213.30.55.0/27"
VOIP_TALK_ACL_TEST_IP="213.30.59.131"

# auto = first IPv4 address on VOIP_TALK_SOURCE_INTERFACE.
VOIP_TALK_SOURCE="auto"
VOIP_TALK_SOURCE_INTERFACE="br0"

# UniFi Talk XML configuration backend and local ACL proxy.
VOIP_TALK_XML_UPSTREAM="http://127.0.0.1:3423"
VOIP_TALK_XML_PROXY_HOST="127.0.0.1"
VOIP_TALK_XML_PROXY_PORT="3424"
VOIP_TALK_XML_CURL_CONFIG="/etc/freeswitch/autoload_configs/xml_curl.conf.xml"

# UniFi Talk service name on current UniFi OS releases.
VOIP_TALK_SERVICE="unifi-talk.service"
